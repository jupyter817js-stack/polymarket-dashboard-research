[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/db",
  "crates/data-api-client",
  "crates/clob-client",
  "crates/ws-client",
  "crates/planner",
  "crates/signer",
  "apps/lifecycle-collector",
  "apps/api",
  "apps/m1-shadow",
  "apps/trader",
]

[workspace.package]
edition    = "2021"
rust-version = "1.85"
authors = ["jupyter817js-stack"]
license    = "UNLICENSED"
repository = "rn1-bot"

[workspace.dependencies]
# async
tokio              = { version = "1", features = ["full"] }
tokio-tungstenite  = { version = "0.27", features = ["native-tls"] }
futures            = "0.3"
async-trait        = "0.1"

# http / web
axum               = { version = "0.8", features = ["macros", "ws"] }
tower              = "0.5"
tower-http         = { version = "0.6", features = ["cors", "trace", "compression-gzip"] }
reqwest            = { version = "0.12", features = ["json", "gzip", "rustls-tls"], default-features = false }

# serde
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"

# db
sqlx               = { version = "0.8", features = ["runtime-tokio", "tls-rustls", "postgres", "chrono", "rust_decimal", "uuid", "json", "macros"] }

# util
chrono             = { version = "0.4", features = ["serde"] }
rust_decimal       = { version = "1", features = ["serde"] }
uuid               = { version = "1", features = ["v4", "serde"] }
anyhow             = "1"
thiserror          = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy            = "0.15"
clap               = { version = "4", features = ["derive", "env"] }
hex                = "0.4"
url                = "2"

[profile.release]
opt-level    = 3
lto          = "thin"
codegen-units = 1
strip        = "symbols"

[profile.dev]
opt-level = 1
